log_format static_timing escape=json
  '{"msec":"$msec","request_id":"$request_id",'
  '"connection":"$connection","connection_requests":"$connection_requests",'
  '"remote_port":"$remote_port","method":"$request_method","uri":"$uri",'
  '"status":"$status","request_time":"$request_time",'
  '"body_bytes_sent":"$body_bytes_sent","content_encoding":"$sent_http_content_encoding"}';

map $request_time $static_slow_request {
  default 0;
  ~^[1-9][0-9]*\. 1;
  ~^0\.[5-9] 1;
}

map $uri $static_cache_control {
  default "no-cache";
  "~^/(?:static|assets)/.+[.-][0-9a-f]{8,}[.](?:js|mjs|css|json|png|webp|svg|woff2?)$" "public, max-age=31536000, immutable";
  "~^/_astro/.+[.][A-Za-z0-9_-]{8,}[.](?:js|mjs|css|png|webp|svg|woff2?)$" "public, max-age=31536000, immutable";
}

server {
    absolute_redirect off;
    listen 3000;
    server_name _;
    server_tokens off;
    access_log /dev/stdout static_timing;
    access_log /dev/stderr static_timing if=$static_slow_request;
    add_header X-Request-ID $request_id always;
    gzip off;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    add_header Cache-Control $static_cache_control;

    root /usr/share/nginx/html;
    index index.html;

    location = /docs { return 301 /docs/introduction/; }
    location = /docs/ { return 301 /docs/introduction/; }
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
